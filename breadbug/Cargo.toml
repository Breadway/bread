[package]
name = "breadbug"
version = "0.10.0"
edition = "2021"
description = "Review and optionally send a crash, freeze or bug report for a bread app"

[[bin]]
name = "breadbug"
path = "src/main.rs"

[lib]
name = "breadbug"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
bread-bug = { path = "../bread-bug" }
bread-scrub = { path = "../bread-scrub" }
clap = { version = "4.5", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
