name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: [self-hosted]
    steps:
      - name: checkout
        shell: bash
        run: |
          set -euo pipefail
          # Inline bootstrap of bread-ecosystem scripts/ci-checkout.sh (merged
          # at c6442cab; see its docs/ci-checkout.md). Keep this block in sync
          # with that helper. Replacing it with a pinned helper fetch plus
          # SHA-256 verification is a separate follow-up.
          if ! [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "checkout: GITHUB_SHA is not a full commit id" >&2
              exit 1
          fi
          checkout=$(mktemp -d "${RUNNER_TEMP:-/tmp}/bread-ci.XXXXXX")
          printf 'BREAD_CI_JOB_DIR=%s\n' "$checkout" >> "$GITHUB_ENV"
          git clone --no-checkout "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "$checkout/src"
          git -C "$checkout/src" -c advice.detachedHead=false checkout --quiet --detach "$GITHUB_SHA"
          actual="$(git -C "$checkout/src" rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
              echo "checkout: HEAD is $actual, expected $GITHUB_SHA" >&2
              exit 1
          fi

      - name: build
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo build --release --locked

      # The GTK front end is its own workspace so the daemon build stays free
      # of GTK headers. It is built with the same shared CI image, which has
      # the GTK4 development packages, and lands in the same target cache.
      - name: build breadbug GUI and launcher
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo build --release --locked --manifest-path breadbug-gui/Cargo.toml

      - name: test
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo test --release --locked --workspace

      # Debug symbols for breadbug, keyed by build-id, taken from the
      # unstripped binaries (the strip happens in "prepare artifacts").
      - name: publish debug symbols
        run: |
          cd "$BREAD_CI_JOB_DIR/src"
          bash ci/publish-symbols.sh \
            target/release/breadd target/release/bread target/release/bread-emit \
            target/release/bread-module-host target/release/breadbug \
            target/release/breadbug-gui target/release/breadbug-launch

      - name: prepare artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="/srv/breadway-dl/bread/${VERSION}"
          mkdir -p "${PKG_DIR}"
          for bin in breadd bread bread-emit bread-module-host breadbug breadbug-gui breadbug-launch; do
            cp "$BREAD_CI_JOB_DIR/src/target/release/${bin}" "${PKG_DIR}/${bin}-x86_64"
            strip "${PKG_DIR}/${bin}-x86_64"
            sha256sum "${PKG_DIR}/${bin}-x86_64" | awk '{print $1}' \
              > "${PKG_DIR}/${bin}-x86_64.sha256"
          done
          cp "$BREAD_CI_JOB_DIR/src/packaging/systemd/breadd.service" "${PKG_DIR}/"
          cp "$BREAD_CI_JOB_DIR/src/packaging/systemd/breadbug-status.service" "${PKG_DIR}/"
          cp "$BREAD_CI_JOB_DIR/src/packaging/systemd/breadbug-status.timer" "${PKG_DIR}/"
          cp "$BREAD_CI_JOB_DIR/src/LICENSE" "${PKG_DIR}/"
          cp "$BREAD_CI_JOB_DIR/src/bakery.toml" "${PKG_DIR}/bakery.toml"
          ln -sfn "${VERSION}" "/srv/breadway-dl/bread/latest"

      - name: regenerate index.json
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set: refusing to regenerate index.json unsigned (would leave a stale signature mismatched against fresh content and break bakery for everyone)"
            exit 1
          fi
          # mktemp: a fixed clone path races when multiple repos' release
          # workflows run close together on the same self-hosted runner.
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-ci-XXXXXX)"
          trap 'rm -rf -- "${ECOSYSTEM_CI_DIR}"' EXIT
          git clone https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          bash "${ECOSYSTEM_CI_DIR}/scripts/gen-index.sh"

      - name: upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="/srv/breadway-dl/bread/${VERSION}"
          gh release create "${GITHUB_REF_NAME}" --repo Breadway/bread \
            --title "bread v${VERSION}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" --repo Breadway/bread \
            "${PKG_DIR}/breadd-x86_64" \
            "${PKG_DIR}/bread-x86_64" \
            "${PKG_DIR}/bread-emit-x86_64" \
            "${PKG_DIR}/bread-module-host-x86_64" \
            "${PKG_DIR}/breadbug-x86_64" \
            "${PKG_DIR}/breadbug-gui-x86_64" \
            "${PKG_DIR}/breadbug-launch-x86_64" \
            "${PKG_DIR}/breadd-x86_64.sha256" \
            "${PKG_DIR}/bread-x86_64.sha256" \
            "${PKG_DIR}/bread-emit-x86_64.sha256" \
            "${PKG_DIR}/bread-module-host-x86_64.sha256" \
            "${PKG_DIR}/breadbug-x86_64.sha256" \
            "${PKG_DIR}/breadbug-gui-x86_64.sha256" \
            "${PKG_DIR}/breadbug-launch-x86_64.sha256" \
            --clobber

      # Runs last so no earlier step loses its tree. Removes only this job's
      # own checkout directory, and only under RUNNER_TEMP.
      - name: clean owned checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BREAD_CI_JOB_DIR:-}" == "${RUNNER_TEMP:-/tmp}"/bread-ci.* && -d "$BREAD_CI_JOB_DIR" ]]; then
            rm -rf -- "$BREAD_CI_JOB_DIR"
          fi
