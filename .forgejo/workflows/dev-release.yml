name: dev release

# Publishes a dev-track build on every push to `main` (the trunk
# branch; there is no separate `dev` branch). See bread-ecosystem's
# docs/release-channels.md for the release-track policy this is part of.
on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        shell: bash
        run: |
          set -euo pipefail
          # Temporary inline bootstrap: the shared helper is not merged yet,
          # so do not fetch or pin an unreviewed branch commit. After ECO-79
          # merges, replace this block with a pinned helper fetch plus hash
          # verification. The helper/bootstrap contract is documented in the
          # bread-ecosystem repo's docs/ci-checkout.md.
          if ! [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "checkout: GITHUB_SHA is not a full commit id" >&2
              exit 1
          fi
          checkout=$(mktemp -d "${RUNNER_TEMP:-/tmp}/bread-ci.XXXXXX")
          printf 'BREAD_CI_JOB_DIR=%s\n' "$checkout" >> "$GITHUB_ENV"
          git clone --no-checkout "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "$checkout/src"
          git -C "$checkout/src" -c advice.detachedHead=false checkout --quiet --detach "$GITHUB_SHA"
          actual="$(git -C "$checkout/src" rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
              echo "checkout: HEAD is $actual, expected $GITHUB_SHA" >&2
              exit 1
          fi

      # Fails fast, before the expensive release build/test below, on any
      # drift between api-schema.toml, the actual bread.*/IPC/CLI surface,
      # Documentation.md, and README.md; see api-schema.toml's header and
      # CONTRIBUTING.md's "Keeping the API docs honest" section.
      - name: check-docs
        run: cd "$BREAD_CI_JOB_DIR/src" && cargo run -p xtask --locked -- check-docs

      - name: build
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo build --release --locked

      # The GTK front end is its own workspace so the daemon build stays free
      # of GTK headers. It is built with the same shared CI image, which has
      # the GTK4 development packages, and lands in the same target cache.
      - name: build breadbug GUI and launcher
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo build --release --locked --manifest-path breadbug-gui/Cargo.toml

      - name: test
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo test --release --locked --workspace

      # breadd/Cargo.toml is the canonical version source (this workspace has
      # no shared workspace.package.version: breadd and bread-cli are kept
      # in lockstep manually).
      - name: compute dev version
        run: |
          set -euo pipefail
          cd "$BREAD_CI_JOB_DIR/src"
          # Base the dev version off the latest published stable tag,
          # not Cargo.toml: Cargo.toml can go stale relative to the last
          # real release (seen in practice: breadbox/breadpad/breadcrumbs/
          # breadpaper), which would make a dev build sort as OLDER than
          # what's already installed and bakery would correctly refuse it.
          LATEST_TAG="$(git ls-remote --tags --refs \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" 'v*' \
            | awk -F/ '{print $NF}' | sed 's/^v//' | (grep -v -- '-' || true) | sort -V | tail -1)"
          if [ -n "${LATEST_TAG}" ]; then
            CUR="${LATEST_TAG}"
          else
            CUR="$(grep -m1 '^version' breadd/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          fi
          IFS='.' read -r MA MI PA <<< "${CUR}"
          SHA="$(git rev-parse --short HEAD)"
          TS="$(date -u +%Y%m%d%H%M%S)"
          echo "VERSION=${MA}.${MI}.$((PA + 1))-dev.${TS}+${SHA}" >> "$GITHUB_ENV"

      # Debug symbols for breadbug, keyed by build-id, taken from the
      # unstripped binaries (the strip happens in "prepare artifacts").
      - name: publish debug symbols
        run: |
          cd "$BREAD_CI_JOB_DIR/src"
          bash ci/publish-symbols.sh \
            target/release/breadd target/release/bread target/release/bread-emit \
            target/release/bread-module-host target/release/breadbug \
            target/release/breadbug-gui target/release/breadbug-launch

      - name: prepare artifacts
        run: |
          set -euo pipefail
          PKG_DIR="/srv/breadway-dl/dev/bread/${VERSION}"
          mkdir -p "${PKG_DIR}"
          for bin in breadd bread bread-emit bread-module-host breadbug breadbug-gui breadbug-launch; do
            cp "$BREAD_CI_JOB_DIR/src/target/release/${bin}" "${PKG_DIR}/${bin}-x86_64"
            strip "${PKG_DIR}/${bin}-x86_64"
            sha256sum "${PKG_DIR}/${bin}-x86_64" | awk '{print $1}' \
              > "${PKG_DIR}/${bin}-x86_64.sha256"
          done
          cp "$BREAD_CI_JOB_DIR/src/packaging/systemd/breadd.service" "${PKG_DIR}/"
          cp "$BREAD_CI_JOB_DIR/src/packaging/systemd/breadbug-status.service" "${PKG_DIR}/"
          cp "$BREAD_CI_JOB_DIR/src/packaging/systemd/breadbug-status.timer" "${PKG_DIR}/"
          cp "$BREAD_CI_JOB_DIR/src/LICENSE" "${PKG_DIR}/"
          cp "$BREAD_CI_JOB_DIR/src/bakery.toml" "${PKG_DIR}/bakery.toml"
          ln -sfn "${VERSION}" "/srv/breadway-dl/dev/bread/latest"

      # No GitHub Release upload: dev builds happen on every push and would
      # spam a release per commit, so dl.breadway.dev/dev/ is the only
      # distribution point for this track.
      - name: regenerate dev index.json
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set: refusing to regenerate dev index.json unsigned (would leave a stale signature mismatched against fresh content and break bakery for everyone on the dev track)"
            exit 1
          fi
          # mktemp: a fixed clone path races when multiple repos' dev/beta
          # workflows run close together on the same self-hosted runner.
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-ci-XXXXXX)"
          trap 'rm -rf -- "${ECOSYSTEM_CI_DIR}"' EXIT
          git clone --branch main https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          TRACK=dev bash "${ECOSYSTEM_CI_DIR}/scripts/gen-index.sh"

      - name: clean owned checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BREAD_CI_JOB_DIR:-}" == "${RUNNER_TEMP:-/tmp}"/bread-ci.* && -d "$BREAD_CI_JOB_DIR" ]]; then
            rm -rf -- "$BREAD_CI_JOB_DIR"
          fi
