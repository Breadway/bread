name: check

# Fast-fail lint/test on short-lived work branches, before it ever reaches
# main and triggers a dev-track release build.
on:
  push:
    branches: ['feature/**', 'fix/**']

jobs:
  check:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        shell: bash
        run: |
          set -euo pipefail
          # Temporary inline bootstrap: the shared helper is not merged yet,
          # so do not fetch or pin an unreviewed branch commit. After ECO-79
          # merges, replace this block with a pinned helper fetch plus hash
          # verification. The helper/bootstrap contract is documented in the
          # bread-ecosystem repo's docs/ci-checkout.md.
          if ! [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "checkout: GITHUB_SHA is not a full commit id" >&2
              exit 1
          fi
          checkout=$(mktemp -d "${RUNNER_TEMP:-/tmp}/bread-ci.XXXXXX")
          printf 'BREAD_CI_JOB_DIR=%s\n' "$checkout" >> "$GITHUB_ENV"
          git clone --no-checkout "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "$checkout/src"
          git -C "$checkout/src" -c advice.detachedHead=false checkout --quiet --detach "$GITHUB_SHA"
          actual="$(git -C "$checkout/src" rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
              echo "checkout: HEAD is $actual, expected $GITHUB_SHA" >&2
              exit 1
          fi

      - name: clippy
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build --workspace
        # Belt-and-braces alongside breadd/tests/common's own explicit
        # `cargo build -p bread-module-host` before spawning it: this makes
        # sure every workspace binary, bread-module-host included, is
        # already built before any test runs, so a test's own build-and-wait
        # is never the first time this CI container has compiled it.
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo build --workspace --locked

      - name: test
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo test --workspace --locked

      # breadbug-gui is deliberately its own workspace (GTK headers are not a
      # dependency of the daemon). Check it explicitly so a broken window,
      # launcher or walkthrough example cannot reach a release build.
      - name: breadbug-gui fmt
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo fmt --manifest-path breadbug-gui/Cargo.toml --check

      - name: breadbug-gui clippy
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo clippy --manifest-path breadbug-gui/Cargo.toml --all-targets --locked -- -D warnings

      - name: breadbug-gui test
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo test --manifest-path breadbug-gui/Cargo.toml --locked

      - name: clean owned checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BREAD_CI_JOB_DIR:-}" == "${RUNNER_TEMP:-/tmp}"/bread-ci.* && -d "$BREAD_CI_JOB_DIR" ]]; then
            rm -rf -- "$BREAD_CI_JOB_DIR"
          fi
