name = "bread"
description = "Reactive automation daemon and CLI for Linux desktops"
binaries = ["breadd", "bread", "bread-emit", "bread-module-host", "breadbug", "breadbug-gui", "breadbug-launch"]
system_deps = ["systemd-libs", "openssl", "zlib", "gtk4"]
optional_system_deps = ["bluez", "hyprland"]
bread_deps = []
license_file = "LICENSE"

[[service]]
unit = "breadd.service"
enable = true

# breadbug checks daily on bug reports you sent. It does nothing unless you
# have turned sending on and have sent a report, and never sends anything.
[[service]]
unit = "breadbug-status.service"
enable = false

[[service]]
unit = "breadbug-status.timer"
enable = true

[config]
dir = "~/.config/bread"
example = "breadd.toml"

[install]
post_install = [
    "systemctl --user is-active --quiet breadd || systemctl --user start breadd",
]
