[package]
name = "bread-bug"
version = "0.9.0"
edition = "2021"
description = "breadbug core: on-disk log/event store, report schema and builder, upload client"

[dependencies]
anyhow.workspace = true
bread-scrub = { path = "../bread-scrub" }
bread-shared = { path = "../bread-shared" }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile.workspace = true
libc = "0.2"
